
spring.application.name=resitrack

spring.datasource.url=jdbc:mysql://localhost:3306/resitrack_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=@apmsystems
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

jwt.secret=${JWT_SECRET:resitrack-dev-secret-key-change-in-production-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.upload.dir=${UPLOAD_DIR:./uploads}

app.payment.gpay.upi-id=${ADMIN_UPI_ID:admin@okicici}
app.payment.gpay.merchant-name=${ADMIN_MERCHANT_NAME:RR Dhurya Welfare Association}

app.cors.allowed-origins=https://resitrack-seven.vercel.app

logging.level.com.resitrack=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN