spring.application.name=resitrack

# ── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── Server ─────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Remember Me / auto-login refresh token — 30 days, in milliseconds
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# ── File uploads ───────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# NOTE: app.upload.dir / UPLOAD_DIR is still read by PhotoUploadService,
# VehicleDocumentUploadService, and ExpenseController, which have NOT been
# migrated to Cloudinary as part of this change (out of scope — only
# payment-screenshot uploads were migrated). Those still use local disk and
# will still lose files on redeploy until they're migrated the same way.
app.upload.dir=${UPLOAD_DIR:./uploads}

# ── Cloudinary (payment screenshot storage) ─────────────────────────────────
# Set these as Environment Variables on the Render service — never commit
# real values to source control.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Payment ────────────────────────────────────────────────────────────────
app.payment.gpay.upi-id=${ADMIN_UPI_ID:admin@okicici}
app.payment.gpay.merchant-name=${ADMIN_MERCHANT_NAME:RR Dhurya Welfare Association}


app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://resitrack-karthikeyani-bs-projects.vercel.app,https://resitrack-seven.vercel.app,https://resitrack-git-main-karthikeyani-bs-projects.vercel.app}

# ── Mail (Brevo SMTP) ────────────────────────────────────────────────────────
# Temporary SMTP verification endpoint (POST /api/test/send-email) — will be
# reused as-is by the Forgot Password feature once this is validated.
# All values come from Render environment variables — never commit real
# credentials to source control.
spring.mail.host=${BREVO_SMTP_HOST:}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verified Brevo sender address used as the "From" header. Kept separate from
# spring.mail.username because Brevo's SMTP login and the verified sender
# email are not always the same value.
app.mail.from=${MAIL_FROM:}

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.resitrack=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN