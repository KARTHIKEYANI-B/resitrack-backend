spring.application.name=resitrack

# ── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── Server ─────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── File uploads ───────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# NOTE: app.upload.dir / UPLOAD_DIR is still read by PhotoUploadService,
# VehicleDocumentUploadService, and ExpenseController, which have NOT been
# migrated to Cloudinary as part of this change (out of scope — only
# payment-screenshot uploads were migrated). Those still use local disk and
# will still lose files on redeploy until they're migrated the same way.
app.upload.dir=${UPLOAD_DIR:./uploads}

# ── Cloudinary (payment screenshot storage) ─────────────────────────────────
# Set these as Environment Variables on the Render service — never commit
# real values to source control.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Payment ────────────────────────────────────────────────────────────────
app.payment.gpay.upi-id=${ADMIN_UPI_ID:admin@okicici}
app.payment.gpay.merchant-name=${ADMIN_MERCHANT_NAME:RR Dhurya Welfare Association}


app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://resitrack-karthikeyani-bs-projects.vercel.app,https://resitrack-seven.vercel.app,https://resitrack-git-main-karthikeyani-bs-projects.vercel.app}

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.resitrack=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN