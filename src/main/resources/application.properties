spring.application.name=resitrack

# ── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── Server ─────────────────────────────────────────────────────────────────
# Render injects PORT — we fall back to 8080 for local dev
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── File uploads ───────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.upload.dir=${UPLOAD_DIR:./uploads}

# ── Payment ────────────────────────────────────────────────────────────────
app.payment.gpay.upi-id=${ADMIN_UPI_ID:admin@okicici}
app.payment.gpay.merchant-name=${ADMIN_MERCHANT_NAME:RR Dhurya Welfare Association}

# ── CORS ───────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.resitrack=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN